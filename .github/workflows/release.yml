name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: apex-rust-macos-arm64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: apex-rust-linux-x86_64.tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p apex-daemon -p apex-cli

      - name: Package Artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/apex-daemon dist/
          cp target/${{ matrix.target }}/release/apex-cli dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

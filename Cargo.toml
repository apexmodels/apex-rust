[workspace]
resolver = "2"
members = [
    "crates/apex-harness",
    "crates/apex-core",
    "crates/apex-web",
    "crates/apex-daemon",
    "crates/apex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nilesh Chakraborty"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
a2a-lf = "0.4"
a2a-server-lf = "0.5"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
memchr = "2.7"
scraper = "0.20"
rust-embed = "8.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
